<section id="projects" class="section container">
  <header class="section-head">
    <h2 class="section-head__title">
      {{ i18n.t('projects.title.pre') }}<em>{{ i18n.t('projects.title.em') }}</em>{{ i18n.t('projects.title.post') }}
    </h2>
    <p class="section-head__lead">
      {{ i18n.t('projects.lead') }}
    </p>
  </header>

  <ol class="looks">
    @for (project of all(); track project.id; let i = $index; let first = $first) {
      <li class="looks__item" [class.looks__item--featured]="first">
        <app-project-card-interactive
          [project]="project"
          [index]="i"
          [total]="all().length"
          [featured]="first"
        />
      </li>
    }
  </ol>

  <p class="outro">
    {{ i18n.t('projects.outro') }}
    <a href="#contact" class="outro__link">{{ i18n.t('projects.outro.cta') }}</a>
  </p>
</section>
