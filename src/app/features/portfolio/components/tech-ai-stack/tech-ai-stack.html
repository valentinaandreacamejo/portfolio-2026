<section id="skills" class="section container">
  <header class="section-head">
    <h2 class="section-head__title">{{ i18n.t('skills.title.pre') }}<em>{{ i18n.t('skills.title.em') }}</em>{{ i18n.t('skills.title.post') }}</h2>
    <p class="section-head__lead">
      {{ i18n.t('skills.lead') }}
    </p>
  </header>

  <div class="stack">
    @for (group of groups(); track group.id) {
      <article class="group">
        <h3 class="group__label">{{ group.label }}</h3>
        <ul class="group__skills">
          @for (skill of group.skills; track skill) {
            <li class="badge">{{ skill }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
