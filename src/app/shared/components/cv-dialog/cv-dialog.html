<dialog #dialog class="cv" aria-labelledby="cv-title" (click)="onDialogClick($event)">
  <div class="cv__panel">
    <button type="button" class="cv__close" (click)="close()" [attr.aria-label]="i18n.t('cv.close')">
      <span aria-hidden="true">✕</span>
    </button>

    <span class="cv__kicker">{{ i18n.t('cv.kicker') }}</span>
    <h2 id="cv-title" class="cv__title">{{ i18n.t('cv.title') }}</h2>
    <p class="cv__lead">{{ i18n.t('cv.lead') }}</p>

    <ul class="cv__options">
      @for (option of options(); track option.code) {
        <li>
          <a
            class="option"
            [class]="'accent-' + option.accent"
            [class.is-current]="option.current"
            [href]="option.href"
            [attr.download]="option.fileName"
            [attr.hreflang]="option.code"
            type="application/pdf"
            (click)="close()"
          >
            <span class="option__code" aria-hidden="true">[{{ option.code.toUpperCase() }}]</span>
            <span class="option__name" [attr.lang]="option.code">{{ option.name }}</span>
            @if (option.current) {
              <span class="option__badge">{{ i18n.t('cv.current') }}</span>
            }
            <span class="option__arrow" aria-hidden="true">↓</span>
          </a>
        </li>
      }
    </ul>
  </div>
</dialog>
